apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-demo
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/iltondasilva/ocp-gitops.git
    targetRevision: main
    path: apps/webapp-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
